[project]
name = "idc-energy-scheduling"
version = "0.1.0"
description = "Data-center computing-load and storage co-optimized scheduling with safe PPO and rolling correction (Apple Silicon / CPU reference platform)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # ---- Core compute / physics (anchored per research plan) ----
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",          # bundles HiGHS: scipy.optimize.linprog / scipy.optimize.milp
    "networkx>=3.4",
    # ---- RL / environment ----
    "torch==2.5.1",           # macOS arm64 CPU/MPS wheel (no CUDA)
    "gymnasium==1.2.3",
    "stable-baselines3==2.8.0",
    # ---- Grid validation ----
    "pandapower==3.4.0",
    # ---- Contracts / config ----
    "pydantic>=2.13",
    "pydantic-settings>=2.10",
    "pandera>=0.26",
    "pyyaml>=6.0",
    # ---- CLI / logging ----
    "typer>=0.15",
    "rich>=13.9",
    "tqdm>=4.67",
    # ---- Storage / experiment tracking ----
    "pyarrow>=19.0",
    "duckdb>=1.2",
    "mlflow>=3.0",
    "tensorboard==2.20.0",
    "openpyxl>=3.1",
    # ---- Visualization ----
    "matplotlib==3.10.9",
    "plotly>=6.0",
    "streamlit>=1.44",
]

[project.optional-dependencies]
marl = [
    # HARL multi-agent baseline; pin to a git sha when first used.
    # "harl @ git+https://github.com/PKU-MARL/HARL.git@<sha>",
]
notebook = [
    "marimo>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.120",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4.1",
]

[tool.uv]
# This repo is a flat collection of packages/scripts imported from the repo root,
# not an installable library. Keep it a virtual (non-package) project.
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "marl/tests"]
pythonpath = ["."]
markers = [
    "leakage: future-information isolation regression tests",
    "resume: bit-exact checkpoint resume tests",
    "slow: long-running tests excluded from make check",
]
